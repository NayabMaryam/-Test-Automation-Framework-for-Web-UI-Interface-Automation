
name: UI Automation CI

on:
  push:
    branches: [main, feature/redis-integration]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, chrome, edge]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          if [ "${{ matrix.browser }}" = "edge" ]; then
            python -m playwright install --with-deps msedge
          else
            python -m playwright install --with-deps ${{ matrix.browser }}
          fi

      - name: Run UI Automation Tests
        run: pytest -v
        env:
          CI: true
          BROWSER: ${{ matrix.browser }}
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_DB: 0
