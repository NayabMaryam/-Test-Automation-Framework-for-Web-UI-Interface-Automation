
name: UI Automation CI

on:
  push:
    branches: [main, feature/redis-integration, feature/allure-reporting]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, chrome, edge]

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Set up Node.js for Allure CLI
      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # 4. Install Python dependencies
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. Install Allure CLI from package-lock.json
      - name: Install Allure CLI
        run: npm ci

      # 6. Install required Playwright browser
      - name: Install Playwright Browsers
        run: |
          if [ "${{ matrix.browser }}" = "edge" ]; then
            python -m playwright install --with-deps msedge
          else
            python -m playwright install --with-deps ${{ matrix.browser }}
          fi

      # 7. Execute UI automation tests
      - name: Run UI Automation Tests
        run: pytest -v
        env:
          CI: true
          BROWSER: ${{ matrix.browser }}
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_DB: 0

      # 8. Generate Allure HTML report
      - name: Generate Allure HTML Report
        if: always()
        run: |
          if [ -d allure-results ] && [ "$(find allure-results -type f | wc -l)" -gt 0 ]; then
            npx allure generate allure-results --clean -o allure-report
          else
            echo "No Allure result files were generated."
          fi

      # 9. Upload raw Allure results
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/
          if-no-files-found: warn
          retention-days: 14

      # 10. Upload generated HTML report
      - name: Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.browser }}
          path: allure-report/
          if-no-files-found: warn
          retention-days: 14
